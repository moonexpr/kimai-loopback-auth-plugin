# LoopbackAuth — REMOTE_USER allowlist for Kimai
# ----------------------------------------------------------------------------
# Drop this file into nginx's http context. On most distributions that means:
#
#     /etc/nginx/conf.d/kimai-loopback-auth.conf
#
# (anything under conf.d/ is included inside the http {} block by the default
# nginx.conf). It defines $kimai_loopback_user, which the Kimai vhost then
# passes to PHP as REMOTE_USER — see enable-remote-user.patch.
#
# This uses `geo` rather than `map` so the allowlist accepts CIDR ranges (a
# `map` only matches exact strings). $remote_addr is the real TCP peer address,
# which a client cannot forge with an HTTP header. The default is the empty
# string, so every address NOT listed below arrives with REMOTE_USER unset and
# Kimai falls back to its normal login form.
#
# SECURITY: keep this list as small as the deployment allows. Loopback only is
# the safest setting. Adding a network here means every host in that network
# can auto-login (passwordless) as the named Kimai user — only widen it to
# networks you fully trust at the device level (e.g. an authenticated tailnet).
#
# This allowlist is the web-server half. The plugin enforces its OWN allowlist
# on REMOTE_ADDR (LOOPBACK_AUTH_TRUSTED_IPS, default loopback) as defense in
# depth — keep the two in agreement, or the plugin will refuse a peer nginx let
# through.
#
# Change "admin" to the Kimai username you want auto-logged-in. The user must
# already exist in Kimai; the plugin authenticates it, it does not create it.

geo $remote_addr $kimai_loopback_user {
    default        "";
    127.0.0.1      "admin";
    ::1            "admin";

    # Trusted tailnet — UNCOMMENT to let authenticated tailscale devices
    # auto-login passwordless. If you enable this, also add the same range to
    # the plugin: LOOPBACK_AUTH_TRUSTED_IPS="127.0.0.1,::1,100.64.0.0/10"
    # 100.64.0.0/10  "admin";
}
