# LoopbackAuth — REMOTE_USER map for Kimai
# ----------------------------------------------------------------------------
# Drop this file into nginx's http context. On most distributions that means:
#
#     /etc/nginx/conf.d/kimai-loopback-auth.conf
#
# (anything under conf.d/ is included inside the http {} block by the default
# nginx.conf). It defines $kimai_loopback_user, which the Kimai vhost then
# passes to PHP as REMOTE_USER — see enable-remote-user.patch.
#
# SECURITY: the key is keyed on $remote_addr, the real TCP peer address, which
# a client cannot forge with an HTTP header. The default is the empty string,
# so every non-loopback request arrives with REMOTE_USER unset and Kimai falls
# back to its normal login form. ONLY loopback peers receive an identity.
#
# If Kimai sits behind a reverse proxy, $remote_addr here is the proxy, not the
# browser — in that case this map must live on the edge proxy that terminates
# the real client connection, or every proxied request will look like loopback.
#
# Change "admin" to the Kimai username you want auto-logged-in locally. The user
# must already exist in Kimai; the plugin authenticates it, it does not create it.

map $remote_addr $kimai_loopback_user {
    default    "";
    127.0.0.1  "admin";
    ::1        "admin";
}
